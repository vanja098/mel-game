<style>
html,body{margin:0;height:100%;background:#0d0b10;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Courier New",ui-monospace,monospace;font-weight:900}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;background:#15121a}
#cv{display:block;width:100%;height:100%}
#hud{position:absolute;left:0;right:0;top:calc(var(--u)*6);display:flex;justify-content:space-between;align-items:center;padding:0 calc(var(--u)*14);pointer-events:none;color:#fff;font-size:calc(var(--u)*34);text-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 #000}
#lv{color:#e63946;font-size:calc(var(--u)*26)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*12);text-align:center;background:rgba(10,8,20,.62);color:#fff}
.hide{display:none!important}
h1{margin:0;font-size:calc(var(--u)*32);line-height:1.05;text-shadow:calc(var(--u)*3) calc(var(--u)*3) 0 #1f4fd8}
p{margin:0;font-size:calc(var(--u)*14);line-height:1.35;text-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 #000;padding:0 calc(var(--u)*16)}
#mel{width:calc(var(--u)*100)}
button{font:inherit;font-size:calc(var(--u)*20);color:#fff;background:#1f4fd8;border:calc(var(--u)*3) solid #000;padding:calc(var(--u)*9) calc(var(--u)*28);box-shadow:calc(var(--u)*5) calc(var(--u)*5) 0 #ffd23f;cursor:pointer}
button:active{transform:translate(calc(var(--u)*3),calc(var(--u)*3));box-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 #ffd23f}
button:focus-visible{outline:calc(var(--u)*3) solid #fff;outline-offset:calc(var(--u)*3)}
#diff{display:flex;gap:calc(var(--u)*6)}
.d{font-size:calc(var(--u)*14);padding:calc(var(--u)*7) calc(var(--u)*9);background:#2a2733;box-shadow:none}
.d.on{background:#ffd23f;color:#000}
.ghost{background:#2a2733;font-size:calc(var(--u)*15);box-shadow:calc(var(--u)*4) calc(var(--u)*4) 0 #000}
.big{font-size:calc(var(--u)*46);color:#ffd23f;text-shadow:calc(var(--u)*3) calc(var(--u)*3) 0 #000}
</style>

// ===== Звук: Web Audio (без лагов и подвисаний, как у <audio>) =====
const AC = window.AudioContext || window.webkitAudioContext;
let ac = null, busyUntil = 0, lastB = -1;
const BUF = { bottle: [], sorrel: [] };
function toBuf(uri) { const s = atob(uri.slice(uri.indexOf(',') + 1)), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; }
function unlock() {
  if (!AC) return;
  if (!ac) {
    ac = new AC();
    Object.keys(SND).forEach(k => SND[k].forEach(uri => ac.decodeAudioData(toBuf(uri), b => BUF[k].push(b), () => {})));
  }
  if (ac.state !== 'running') ac.resume();
  const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(0);
}
// Играет, только если предыдущий звук доигран. Возвращает индекс звука или -1.
function play(kind) {
  const list = BUF[kind];
  if (!ac || !list.length || ac.currentTime < busyUntil) return -1;
  let i = Math.floor(Math.random() * list.length);
  if (kind === 'bottle' && list.length > 1 && i === lastB) i = (i + 1) % list.length;
  if (kind === 'bottle') lastB = i;
  const src = ac.createBufferSource(); src.buffer = list[i]; src.connect(ac.destination); src.start();
  busyUntil = ac.currentTime + list[i].duration;
  return i;
}
addEventListener('pointerdown', () => { if (!ac || ac.state !== 'running') unlock(); }, { passive: true });

// ===== Картинки и заранее отрисованные спрайты =====
const img = {}; let loaded = 0; const NEED = Object.keys(ASSETS).length;
let scale = 1, px = 1, bgC, S = {}, frames = [], words = [];
const mel = { x: W / 2, tx: W / 2, w: 108, h: 116 };
const BW = 36, SW = 46;

function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w * px)); c.height = Math.max(1, Math.ceil(h * px)); return c; }
function sprite(im, w, h) { const c = mk(w, h); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); return c; }
function textSprite(t, size, fill) {
  const c0 = mk(1, 1).getContext('2d'); c0.font = `900 ${size * px}px "Courier New",monospace`;
  const w = c0.measureText(t).width / px + 14, h = size + 14, c = mk(w, h), g = c.getContext('2d');
  g.font = c0.font; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round'; g.lineWidth = 5 * px;
  g.strokeStyle = '#000'; g.strokeText(t, c.width / 2, c.height / 2); g.fillStyle = fill; g.fillText(t, c.width / 2, c.height / 2);
  return { c, w, h };
}
// Всё, что можно посчитать один раз, считаем при загрузке и смене размера — не в кадре.
function buildSprites() {
  if (loaded < NEED) return;
  bgC = mk(W, H); const g = bgC.getContext('2d'), b = img.bg, k = Math.max(bgC.width / b.width, bgC.height / b.height);
  g.drawImage(b, (bgC.width - b.width * k) / 2, (bgC.height - b.height * k) / 2, b.width * k, b.height * k);
  g.fillStyle = 'rgba(10,8,20,.22)'; g.fillRect(0, 0, bgC.width, bgC.height);
  S.mel = sprite(img.mel, mel.w, mel.h);
  S.bottleH = BW * img.bottle.height / img.bottle.width; S.bottle = sprite(img.bottle, BW, S.bottleH);
  S.sorrelH = SW * img.sorrel.height / img.sorrel.width; S.sorrel = sprite(img.sorrel, SW, S.sorrelH);
  const fh = mel.h, fw = fh * EAT.fw / EAT.fh; S.fw = fw; S.fh = fh; frames = [];
  for (let i = 0; i < EAT.n; i++) {
    const c = mk(fw, fh);
    c.getContext('2d').drawImage(img.eat, (i % EAT.cols) * EAT.fw, ((i / EAT.cols) | 0) * EAT.fh, EAT.fw, EAT.fh, 0, 0, c.width, c.height);
    frames.push(c);
  }
  words = WORDS.map(t => textSprite(t, 22, '#ffd23f'));
  words.push(textSprite('+1', 22, '#ffffff'), textSprite('ЩАВЕЛЬ! −♥', 22, '#7ddc4f'));
  dirty = true;
}
function fit() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  px = scale * Math.min(window.devicePixelRatio || 1, 2);   // 2x хватает, 3x только грузит телефон
  stage.style.width = W * scale + 'px'; stage.style.height = H * scale + 'px';
  stage.style.setProperty('--u', scale + 'px');
  cv.width = Math.round(W * px); cv.height = Math.round(H * px);
  ctx.setTransform(px, 0, 0, px, 0, 0);
  const r = stage.getBoundingClientRect(); sx = r.left; sw = r.width;
  buildSprites();
}
let sx = 0, sw = 1, dirty = true;
addEventListener('resize', fit);
Object.keys(ASSETS).forEach(k => { const i = new Image(); i.onload = () => { if (++loaded === NEED) { fit(); showMenu(); } }; i.src = ASSETS[k]; img[k] = i; });
fit();

let mode = 'menu', paused = false, score = 0, lives = 3, D = DIFFS[diff];

function setHud() { elSc.textContent = score; elLv.textContent = '♥'.repeat(Math.max(0, lives)); }
function start() {
  unlock(); D = DIFFS[diff];
  score = 0; lives = D.lives; items.length = 0; popups.length = 0; spawnT = 0.4; flash = 0; eatT = -1;
  mel.x = mel.tx = W / 2; setHud();
  $('menu').classList.add('hide'); $('over').classList.add('hide'); $('hud').classList.remove('hide');
  mode = 'play';
}
function showBest() { $('bst').textContent = best[diff] ? 'Рекорд: ' + best[diff] : ''; }
function showMenu() {
  mode = 'menu'; dirty = true;
  if (!$('mel').src) $('mel').src = ASSETS.mel;
  $('hud').classList.add('hide'); $('over').classList.add('hide'); $('menu').classList.remove('hide');
  pickDiff(diff);
}
function pickDiff(k) {
  diff = k; try { localStorage.setItem('mel_diff', k); } catch (e) {}
  document.querySelectorAll('.d').forEach(b => b.classList.toggle('on', b.dataset.d === k));
  $('hint').textContent = DIFFS[k].hint; showBest();
}
function gameOver() {

  $('fs').textContent = score; $('fb').textContent = 'Рекорд: ' + best[diff];

}

function spawn() {
  const s = Math.random() < D.sorrel, w = s ? SW : BW;
  items.push({ x: 30 + Math.random() * (W - 60), y: -(s ? S.sorrelH : S.bottleH), h: s ? S.sorrelH : S.bottleH, s,

}
function addPopup(i, x, y) { popups.push({ x: Math.max(70, Math.min(W - 70, x)), y, t: 0, i }); }

function update(dt) {
  if (dir) mel.tx = Math.max(mel.w / 2, Math.min(W - mel.w / 2, mel.tx + dir * 420 * dt));
  mel.x += (mel.tx - mel.x) * Math.min(1, dt * 18);
  if (eatT >= 0) { eatT += dt; if (eatT / EAT.delay >= EAT.n) eatT = -1; }
  if (flash > 0) flash = Math.max(0, flash - dt * 3);
  if ((spawnT -= dt) <= 0) { spawn(); spawnT = Math.max(D.imin, D.i0 - score * D.ik); }
  const top = H - mel.h - 12;
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.vy * dt; it.rot += it.vr * dt;
    let gone = false;
    // «в рот»: верхняя часть головы Мелстроя
    if (it.y + it.h > top + 8 && it.y + it.h / 2 < top + mel.h * 0.6 && Math.abs(it.x - mel.x) < mel.w * 0.38) {
      gone = true; eatT = 0;
      if (it.s) {
        lives--; flash = 1; setHud(); haptic('heavy'); play('sorrel'); addPopup(4, mel.x, top - 6);
      } else {
        score++; setHud(); haptic('light');
        const k = play('bottle'); addPopup(k < 0 ? 3 : k, mel.x, top - 6);
      }
    } else if (it.y > H) {
      gone = true;
      if (!it.s) { lives--; flash = 1; setHud(); haptic('heavy'); }   // щавель мимо — не страшно
    }
    if (gone) { items[i] = items[items.length - 1]; items.pop(); }
    if (lives <= 0) return gameOver();
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    if ((popups[i].t += dt) > 0.9) { popups[i] = popups[popups.length - 1]; popups.pop(); }
  }
}

function draw() {
  ctx.drawImage(bgC, 0, 0, W, H);
  const k = px;
  for (let i = 0; i < items.length; i++) {
    const it = items[i], a = Math.sin(it.rot) * 0.35, c = Math.cos(a) * k, s = Math.sin(a) * k, sp = it.s ? S.sorrel : S.bottle, w = it.s ? SW : BW;
    ctx.setTransform(c, s, -s, c, it.x * k, (it.y + it.h / 2) * k);
    ctx.drawImage(sp, -w / 2, -it.h / 2, w, it.h);
  }
  ctx.setTransform(k, 0, 0, k, 0, 0);
  const top = H - mel.h - 12;
  if (eatT >= 0) ctx.drawImage(frames[Math.min(EAT.n - 1, (eatT / EAT.delay) | 0)], mel.x - S.fw / 2, top, S.fw, S.fh);
  else ctx.drawImage(S.mel, mel.x - mel.w / 2, top, mel.w, mel.h);
  for (let i = 0; i < popups.length; i++) {
    const p = popups[i], w = words[p.i];
    ctx.globalAlpha = 1 - p.t / 0.9;
    ctx.drawImage(w.c, p.x - w.w / 2, p.y - p.t * 70 - w.h / 2, w.w, w.h);
  }
  ctx.globalAlpha = 1;
  if (flash > 0) { ctx.fillStyle = `rgba(214,40,40,${flash * 0.35})`; ctx.fillRect(0, 0, W, H); }
}

function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0); lastT = t;
  if (loaded === NEED) {
    if (mode === 'play' && !paused) { update(dt); draw(); }
    else if (dirty) { draw(); dirty = false; }
  }
  requestAnimationFrame(loop);
}

// ===== Управление =====
const clampX = x => Math.max(mel.w / 2, Math.min(W - mel.w / 2, x));
function moveTo(e) { if (mode === 'play') mel.tx = clampX((e.clientX - sx) / sw * W); }
stage.addEventListener('pointerdown', moveTo, { passive: true });
stage.addEventListener('pointermove', moveTo, { passive: true });
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') dir = -1;
  else if (e.key === 'ArrowRight' || e.key === 'd') dir = 1;
  else if ((e.key === 'Enter' || e.key === ' ') && mode !== 'play') start();
});
addEventListener('keyup', e => { if (['ArrowLeft', 'a', 'ArrowRight', 'd'].includes(e.key)) dir = 0; });
document.querySelectorAll('.d').forEach(b => b.onclick = () => pickDiff(b.dataset.d));
$('go').onclick = start; $('again').onclick = start; $('tomenu').onclick = showMenu;
// Пауза, когда игру свернули
document.addEventListener('visibilitychange', () => {
  paused = document.hidden; lastT = performance.now();
  if (ac) { paused ? ac.suspend() : ac.resume(); }
});

requestAnimationFrame(loop);
})();
</script>
</body>
</html>
