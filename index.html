const POPUPS = ['АМ!', 'МЁД ПО ТЕЛУ!'];

const W = 360, H = 640;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage'), ui = document.getElementById('ui');
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }

// ===== Подгонка размера под экран =====
let scale = 1;
function fit() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  stage.style.width = W * scale + 'px';
  stage.style.height = H * scale + 'px';
  stage.style.setProperty('--u', scale + 'px');
  cv.width = W * scale * dpr; cv.height = H * scale * dpr;
  cv.style.width = '100%'; cv.style.height = '100%';
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
addEventListener('resize', fit); fit();

// ===== Рекорд =====
let best = 0;
function loadBest() {
  try { best = +localStorage.getItem('mel_best') || 0; } catch (e) {}
  try { tg && tg.CloudStorage && tg.CloudStorage.getItem('best', (err, v) => { if (!err && +v > best) best = +v; }); } catch (e) {}
}
function saveBest() {
  try { localStorage.setItem('mel_best', best); } catch (e) {}
  try { tg && tg.CloudStorage && tg.CloudStorage.setItem('best', String(best)); } catch (e) {}
}
loadBest();

// ===== Звуки =====
const snd = SOUNDS.map(s => { const a = new Audio(s); a.preload = 'auto'; return a; });
let lastSnd = -1;
function playCatch() {
  let i = Math.random() < 0.5 ? 0 : 1;
  if (i === lastSnd && Math.random() < 0.6) i = 1 - i; // чаще чередуем звуки
  lastSnd = i;
  snd.forEach(a => a.pause());
  snd[i].currentTime = 0;
  snd[i].play().catch(() => {});
  return i;
}
function unlockAudio() { snd.forEach(a => { a.muted = true; a.play().then(() => { a.pause(); a.muted = false; a.currentTime = 0; }).catch(() => { a.muted = false; }); }); }

// ===== Картинки =====
const img = {};
let loaded = 0;
Object.keys(ASSETS).forEach(k => { const i = new Image(); i.onload = () => { loaded++; if (loaded === 3) showMenu(); }; i.src = ASSETS[k]; img[k] = i; });

// ===== Состояние игры =====
const mel = { x: W / 2, tx: W / 2, w: 108, h: 116, bump: 0 };
let mode = 'menu', score = 0, lives = 3, bottles = [], popups = [], spawnT = 0, flash = 0, lastT = 0, dir = 0;

function reset() { score = 0; lives = 3; bottles = []; popups = []; spawnT = 0.4; flash = 0; mel.x = mel.tx = W / 2; }

function spawn() {
  const w = 36, h = w * 1094 / 581;
  bottles.push({ x: 30 + Math.random() * (W - 60), y: -h, w, h, vy: Math.min(180 + score * 3, 400) + Math.random() * 60, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 3 });
}

function haptic(t) { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t); } catch (e) {} }

function update(dt) {
  if (dir) mel.tx = Math.max(mel.w / 2, Math.min(W - mel.w / 2, mel.tx + dir * 420 * dt));
  mel.x += (mel.tx - mel.x) * Math.min(1, dt * 18);
  mel.bump = Math.max(0, mel.bump - dt * 5);
  flash = Math.max(0, flash - dt * 3);
  spawnT -= dt;
  if (spawnT <= 0) { spawn(); spawnT = Math.max(0.42, 1.1 - score * 0.015); }
  const melTop = H - mel.h - 12;
  for (let i = bottles.length - 1; i >= 0; i--) {
    const b = bottles[i];
    b.y += b.vy * dt; b.rot += b.vr * dt;
    const bottom = b.y + b.h;
    // ловим бутылку «в рот»: верхняя часть головы Мелстроя
    if (bottom > melTop + 8 && b.y + b.h / 2 < melTop + mel.h * 0.6 && Math.abs(b.x - mel.x) < mel.w * 0.38) {
      bottles.splice(i, 1);
      score++; mel.bump = 1;
      const s = playCatch();
      popups.push({ x: mel.x, y: melTop - 6, t: 0, text: POPUPS[s] });
      haptic('light');
    } else if (b.y > H) {
      bottles.splice(i, 1);
      lives--; flash = 1; haptic('heavy');
      if (lives <= 0) return gameOver();
    }
  }
  popups.forEach(p => { p.t += dt; });
  popups = popups.filter(p => p.t < 0.9);
}

function draw() {
  // фон: гаражи, «cover» по размеру
  const bw = img.bg.width, bh = img.bg.height, k = Math.max(W / bw, H / bh);
  ctx.drawImage(img.bg, (W - bw * k) / 2, (H - bh * k) / 2, bw * k, bh * k);
  ctx.fillStyle = 'rgba(10,8,20,.22)'; ctx.fillRect(0, 0, W, H);
  // чекушки
  bottles.forEach(b => {
    ctx.save(); ctx.translate(b.x, b.y + b.h / 2); ctx.rotate(Math.sin(b.rot) * 0.35);
    ctx.drawImage(img.bottle, -b.w / 2, -b.h / 2, b.w, b.h); ctx.restore();
  });
  // Мелстрой
  const s = 1 + 0.1 * mel.bump, top = H - mel.h - 12;
  ctx.save(); ctx.translate(mel.x, top + mel.h); ctx.scale(s, s);
  ctx.drawImage(img.mel, -mel.w / 2, -mel.h, mel.w, mel.h); ctx.restore();
  // всплывающие слова
  ctx.textAlign = 'center'; ctx.font = '900 22px "Courier New",monospace'; ctx.lineJoin = 'round';
  popups.forEach(p => {
    ctx.globalAlpha = 1 - p.t / 0.9;
    const y = p.y - p.t * 70;
    ctx.lineWidth = 5; ctx.strokeStyle = '#000'; ctx.strokeText(p.text, Math.max(70, Math.min(W - 70, p.x)), y);
    ctx.fillStyle = '#ffd23f'; ctx.fillText(p.text, Math.max(70, Math.min(W - 70, p.x)), y);
  });
  ctx.globalAlpha = 1;
  // счёт и жизни
  ctx.textAlign = 'left'; ctx.font = '900 34px "Courier New",monospace'; ctx.lineWidth = 6;
  ctx.strokeStyle = '#000'; ctx.strokeText(score, 14, 44); ctx.fillStyle = '#fff'; ctx.fillText(score, 14, 44);
  ctx.textAlign = 'right'; ctx.font = '900 28px "Courier New",monospace';
  const hearts = '♥'.repeat(Math.max(0, lives));
  ctx.strokeText(hearts, W - 14, 42); ctx.fillStyle = '#e63946'; ctx.fillText(hearts, W - 14, 42);
  if (flash > 0) { ctx.fillStyle = `rgba(214,40,40,${flash * 0.35})`; ctx.fillRect(0, 0, W, H); }
}

function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0); lastT = t;
  if (mode === 'play') update(dt);
  if (loaded === 3) draw();
  requestAnimationFrame(loop);
}

// ===== Экраны =====
function showMenu() {
  mode = 'menu';
  ui.className = '';
  ui.innerHTML = `<img id="mel" src="${ASSETS.mel}" alt=""><h1>Мелстрой<br>ловит чекушки</h1><p>Води пальцем — лови ртом.<br>Упустил три — игра окончена.</p><button id="go">Играть</button>${best ? `<p>Рекорд: ${best}</p>` : ''}`;
  document.getElementById('go').onclick = start;
}
function start() { unlockAudio(); reset(); ui.className = 'hide'; mode = 'play'; }
function gameOver() {
  mode = 'over';
  if (score > best) { best = score; saveBest(); }
  ui.className = '';
  ui.innerHTML = `<h1>Хватит</h1><div class="big">${score}</div><p>Рекорд: ${best}</p><button id="go">Ещё раз</button>`;
  document.getElementById('go').onclick = start;
}

// ===== Управление =====
function pointerX(e) { const r = stage.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
function moveTo(e) { if (mode === 'play') mel.tx = Math.max(mel.w / 2, Math.min(W - mel.w / 2, pointerX(e))); }
stage.addEventListener('pointerdown', moveTo);
stage.addEventListener('pointermove', moveTo);
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') dir = -1;
  else if (e.key === 'ArrowRight' || e.key === 'd') dir = 1;
  else if ((e.key === 'Enter' || e.key === ' ') && mode !== 'play') start();
});
addEventListener('keyup', e => { if (['ArrowLeft', 'a', 'ArrowRight', 'd'].includes(e.key)) dir = 0; });
document.addEventListener('visibilitychange', () => { lastT = performance.now(); });

requestAnimationFrame(loop);
})();
</script>
</body>
